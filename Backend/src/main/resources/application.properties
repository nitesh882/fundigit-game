spring.application.name=authapp
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fundigitgame;WRITE_DELAY=0}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.h2.console.enabled=false
jwt.secret=${JWT_SECRET:local-development-key-change-before-hosting}
jwt.expiration=${JWT_EXPIRATION:3600000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://127.0.0.1:5173,http://127.0.0.1:5174,http://127.0.0.1:5175}
management.endpoints.web.exposure.include=health
